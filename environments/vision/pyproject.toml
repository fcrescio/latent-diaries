[project]
name = "latent-diaries-vision-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "transformers==5.19.0",
  "torchvision==0.29.1",
  "huggingface-hub==1.31.0",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "pytest>=8,<10",
]

[tool.uv]
package = false
# Torch comes from the primary worker lock; do not duplicate its CUDA stack.
exclude-dependencies = ["torch"]
