name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.24
      - run: uv sync --locked --extra test
      - run: make test
      - run: python -m compileall -q src services scripts
      - run: python scripts/security_scan.py
  docker-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.review -t latent-diaries-review:test .
