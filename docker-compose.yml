name: latent-diaries
services:
  review:
    build:
      context: .
      dockerfile: docker/Dockerfile.review
    environment:
      REVIEW_USER: ${REVIEW_USER:-reviewer}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
      REVIEW_DB: /workspace/run-data/reviews.sqlite3
      REVIEW_ASSETS: /workspace/run-data/review-assets
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8080}:8080"
    volumes:
      - ./run-data:/workspace/run-data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  experiment:
    profiles: ["experiment"]
    image: latent-diaries-worker:local
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        WORKER_BASE_IMAGE: ${LD_WORKER_BASE_IMAGE:-python:3.11-slim}
    environment:
      HF_HOME: /cache/hf
      HF_TOKEN: ${HF_TOKEN:-}
      HF_NAMESPACE: ${HF_NAMESPACE:-}
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      LD_REF_AUDIO: ${LD_REF_AUDIO:-}
      LD_REF_TEXT: ${LD_REF_TEXT:-}
      LD_QWEN_MODEL: ${LD_QWEN_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      LD_QWEN_REVISION: ${LD_QWEN_REVISION:-}
      LD_CODE_REVISION: ${LD_CODE_REVISION:-}
    volumes:
      - ./run-data:/workspace/run-data
      - ./artifacts:/workspace/artifacts
      - ./configs:/workspace/configs:ro
      - hf-cache:/cache/hf
    working_dir: /workspace
    command: ["latent-diaries", "doctor"]
  experiment-gpu:
    profiles: ["gpu"]
    extends:
      service: experiment
    gpus: all
volumes:
  hf-cache:
