[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-diaries"
version = "0.1.0"
description = "Image-conditioned textless Italian narrative speech research bootstrap"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "python-dotenv>=1,<2", "huggingface_hub>=0.36,<1", "pillow>=10,<13"]

[project.optional-dependencies]
ml = ["torch>=2.5,<3", "transformers==4.57.3", "qwen-tts==0.1.1", "soundfile>=0.12,<1", "numpy>=1.26,<3", "accelerate==1.12.0", "safetensors>=0.5,<1", "peft>=0.13,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
latent-diaries = "latent_diaries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
